name: Update verified QX subscription

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: qx-subscription-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 curl unzip python3-yaml
      - name: Select and verify proxies
        run: |
          rm -rf out_qx
          python3 qx_selector.py \
            --publish-github off \
            --regions HK,TW,JP,US \
            --total 60 \
            --per-region 15 \
            --region-candidates 500 \
            --proxy-chunk 20 \
            --verify-rounds 2 \
            --delay-timeout 10 \
            --cache-ttl 0 \
            --out out_qx
          test -s out_qx/qx_sub.txt
          lines=$(grep -cve '^$' out_qx/qx_sub.txt)
          test "$lines" -ge 1
          cp out_qx/qx_sub.txt qx_sub.txt
          cp out_qx/report.txt report.txt
      - name: Publish only verified result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add qx_sub.txt report.txt
          git diff --cached --quiet && exit 0
          git commit -m "Update verified QX nodes $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
